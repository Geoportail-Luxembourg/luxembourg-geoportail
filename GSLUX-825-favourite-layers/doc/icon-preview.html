<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geoportail Icons Preview</title>
    <style>
      @font-face {
        font-family: 'geoportail-icons-wc';
        src: url('./fonts/geoportail-icons-wc.woff') format('woff');
      }

      :root {
        color-scheme: light;
        --bg: #f7f8fa;
        --panel: #ffffff;
        --border: #d7dbe2;
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #0f766e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(247, 248, 250, 0.95);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.6rem;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      .controls {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 16px;
      }

      input {
        flex: 1 1 320px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        font-size: 1rem;
      }

      .stats {
        margin-top: 16px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 14px;
        margin-top: 24px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 16px 14px;
        box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
        transition:
          transform 0.12s ease,
          box-shadow 0.12s ease;
      }

      .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
      }

      .icon {
        font-family: 'geoportail-icons-wc';
        font-size: 2rem;
        line-height: 1;
        color: var(--accent);
        min-height: 36px;
        display: flex;
        align-items: center;
      }

      .code {
        margin-top: 10px;
        font-weight: 700;
        letter-spacing: 0.03em;
      }

      .char {
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container">
        <h1>Geoportail Icons Preview</h1>
        <p>
          Plage de test: E000 → E064 pour <strong>geoportail-icons-wc</strong>
        </p>
        <div class="controls">
          <input
            id="filter"
            type="search"
            placeholder="Filtrer par code, par ex. E010"
          />
        </div>
        <div class="stats" id="stats"></div>
      </div>
    </header>

    <main class="container">
      <div class="grid" id="grid"></div>
    </main>

    <script>
      const start = 0xe000
      const end = 0xe064
      const grid = document.getElementById('grid')
      const filter = document.getElementById('filter')
      const stats = document.getElementById('stats')

      const items = []

      for (let code = start; code <= end; code++) {
        const hex = code.toString(16).toUpperCase().padStart(4, '0')
        const card = document.createElement('div')
        card.className = 'card'
        card.dataset.code = hex
        card.innerHTML = `
          <div class="icon">&#x${hex};</div>
          <div class="code">U+${hex}</div>
          <div class="char">&#x${hex};</div>
        `
        grid.appendChild(card)
        items.push(card)
      }

      function updateStats() {
        const visible = items.filter(
          item => !item.classList.contains('hidden')
        ).length
        stats.textContent = `${visible} icône(s) affichée(s) sur ${items.length}`
      }

      function applyFilter(value) {
        const query = value.trim().toUpperCase()
        items.forEach(item => {
          const code = item.dataset.code
          const show = !query || code.includes(query)
          item.classList.toggle('hidden', !show)
        })
        updateStats()
      }

      filter.addEventListener('input', event => {
        applyFilter(event.target.value)
      })

      updateStats()
    </script>
  </body>
</html>
